<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bright Days Job Fair</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <a class="skip" href="#passage">跳至文章</a>
    <a class="skip" href="#questions">跳至題目</a>
    <header class="topbar">
      <div class="topbar-text">
        <p class="eyebrow" id="pack-title-zh">Bright Days 招聘會閱讀理解</p>
        <h1 id="pack-title">Bright Days Job Fair</h1>
      </div>
      <div class="topbar-actions">
        <p id="score" data-earned="0" data-total="7" data-done="0" data-station="bright-days" data-scored-count="7">得分 0 / 7</p>
        <button type="button" id="reset-btn" data-action="reset">重新開始</button>
      </div>
      <p id="live" class="visually-hidden" aria-live="polite"></p>
    </header>
    <p id="session-note">分數只留在這次開啟的頁面內。按「重新開始」、重新載入或關閉頁面後，分數便會清除。</p>
    <main class="workspace" id="workspace" data-station="bright-days">
      <section class="passage-pane" id="passage" aria-label="招聘廣告">
        <p class="loading">正在載入文章。</p>
      </section>
      <section class="question-pane" id="questions" aria-label="題目">
        <p class="loading">正在載入題目。</p>
      </section>
    </main>
    <noscript><p class="feedback is-incorrect">請啟用 JavaScript 以使用本練習。</p></noscript>
    <script src="js/marking.js"></script>
    <script src="js/passages.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
